name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag or branch to build
        required: true
      publish_release:
        description: Publish or replace the GitHub release
        required: false
        type: boolean
        default: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  YTDLP_VERSION: "2026.08.19"
  YTDLP_SHA256: "66674953fe251b89f4d08c5f0e35e0728679bd67ab3d7d05c0562af101dd3e7a"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.8.3"
          arch: win64_mingw
          modules: qtmultimedia
          tools: tools_mingw1310
          cache: true

      - name: Configure
        run: cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/release --config Release --parallel 4

      - name: Deploy portable application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'dist/EchoBox-II'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item -LiteralPath 'build/release/EchoBoxII.exe' -Destination $dist
          Copy-Item -LiteralPath 'build/release/EchoBoxUpdater.exe' -Destination $dist
          Copy-Item -LiteralPath 'THIRD_PARTY_NOTICES.md' -Destination $dist
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw "$dist/EchoBoxII.exe"

          $mingwBin = Split-Path -Parent (Get-Command g++.exe).Source
          foreach ($dll in 'libgcc_s_seh-1.dll','libstdc++-6.dll','libwinpthread-1.dll') {
            $source = Join-Path $mingwBin $dll
            if (Test-Path -LiteralPath $source) {
              Copy-Item -LiteralPath $source -Destination $dist
            }
          }

          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/download/$env:YTDLP_VERSION/yt-dlp.exe" `
            -OutFile (Join-Path $dist 'yt-dlp.exe')
          $actualYtDlpHash = (Get-FileHash -Algorithm SHA256 `
            -LiteralPath (Join-Path $dist 'yt-dlp.exe')).Hash.ToLowerInvariant()
          if ($actualYtDlpHash -ne $env:YTDLP_SHA256) {
            throw "yt-dlp SHA-256 mismatch: $actualYtDlpHash"
          }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ($env:RELEASE_TAG).TrimStart('v')
          New-Item -ItemType Directory -Force -Path release_pkg | Out-Null
          Compress-Archive -Path 'dist/EchoBox-II/*' `
            -DestinationPath "release_pkg/EchoBox-II-$version-portable.zip" `
            -CompressionLevel Optimal

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --version=6.7.1 -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler not found: $iscc"
          }
          & $iscc 'installer/echobox.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Publish SHA-256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ($env:RELEASE_TAG).TrimStart('v')
          $assets = @(
            "release_pkg/EchoBox-II-$version-portable.zip",
            "installer_out/EchoBoxII-Setup-$version.exe"
          )
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $asset)"
          }
          [IO.File]::WriteAllLines(
            (Join-Path $PWD 'release_pkg/SHA256SUMS.txt'),
            $lines,
            [Text.UTF8Encoding]::new($false))

      - name: Attest portable build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release_pkg/EchoBox-II-*-portable.zip

      - name: Attest installer build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: installer_out/EchoBoxII-Setup-*.exe

      - name: Publish GitHub release
        if: github.event_name == 'push' || inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ($env:RELEASE_TAG).TrimStart('v')
          gh release create $env:RELEASE_TAG `
            "release_pkg/EchoBox-II-$version-portable.zip#EchoBox II $version portable" `
            "installer_out/EchoBoxII-Setup-$version.exe#EchoBox II $version installer" `
            "release_pkg/SHA256SUMS.txt#SHA-256 checksums" `
            --title "EchoBox II $env:RELEASE_TAG" `
            --generate-notes `
            --verify-tag `
            --latest
